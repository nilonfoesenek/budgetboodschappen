<style>
/* VOICE: nuchter en snel, een lijstje dat je in de winkel met één duim gebruikt
   IDEA: de kassabon: per winkel een bonnetje met regels en een subtotaal
   PICTURE: de totaalkaart met per winkel een balk, daaronder de bonnetjes
   COLOUR and TYPE: wit, inkt, groen voor besparing; winkelstipjes in eigen kleur; Figtree
   LAYOUT: één kolom op telefoonbreedte, tabbladen bovenaan */
:root{color-scheme:light;--bg:#fbfbfa;--card:#fff;--ink:#15171a;--mute:#6a6d73;--line:#e3e4df;--field:#f1f2ee;--ok:#16834a;--okbg:#e5f4ea;--warn:#b25a00;--ah:#00a0e2;--jumbo:#f2c200;--aldi:#1c3f94;--dirk:#d6001c;--plus:#2f9e44;--lidl:#7b4fc9}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}
header{padding:calc(14px + env(safe-area-inset-top)) 0 12px}
header .stores{margin-top:12px}
h1{font-size:clamp(23px,6.6vw,30px);letter-spacing:-.5px;line-height:1.05;margin:0;font-weight:800}
h2{font-size:20px;margin:0 0 8px;font-weight:700}
.brand{display:flex;align-items:center;gap:10px}.brand img{flex:none;width:38px;height:38px;border-radius:11px;box-shadow:0 2px 6px rgba(15,107,58,.25)}
h1 span{color:var(--ok)}
.pct{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:800;font-size:12px;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.stores[hidden]{display:none}
.stores{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 4px}
.st{display:flex;align-items:center;gap:8px;justify-content:center;border:1.5px solid var(--line);background:var(--card);color:var(--mute);border-radius:12px;min-height:48px;font:700 15px Figtree,sans-serif;cursor:pointer;padding:6px}
.st[aria-pressed=true]{border-color:var(--ink);color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
.st[aria-pressed=false] .dot{opacity:.3}
.st small{display:block;font:600 11px Figtree,sans-serif;color:var(--mute);line-height:1.1}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
nav .seg{display:flex;max-width:560px;margin:0 auto}
nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;font:600 11.5px Figtree,sans-serif;color:var(--mute);min-height:52px;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-selected=true]{color:var(--ink)}nav button[aria-selected=true] svg{stroke-width:2.4}nav button[data-tab=recipes][aria-selected=true] svg{fill:currentColor}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,24,20,.04)}
.total{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-size:clamp(36px,10vw,48px);font-weight:800;line-height:1;white-space:nowrap}
.subtag{display:inline-block;background:#fff2d6;color:#8a5a00;font-weight:700;font-size:11px;border-radius:5px;padding:0 5px;margin-right:2px}
.subn{color:#8a5a00;font-weight:700;font-size:13px}
.save{display:inline-block;background:var(--okbg);color:var(--ok);font-weight:700;border-radius:8px;padding:4px 10px;font-size:14px;margin-top:8px}
.bars{margin-top:14px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:72px minmax(0,1fr) 74px;gap:8px;align-items:center;font-size:14px}
.bar .tr{height:12px;background:var(--field);border-radius:6px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:6px}
.bar .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.mode{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.mode.hscroll{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-left:-16px;margin-right:-16px;padding:0 16px}.mode.hscroll::-webkit-scrollbar{display:none}.mode.hscroll .chip{flex:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:40px;font:600 14px Figtree,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bon{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.bon>.hd{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px dashed var(--line)}
.bon>.hd b{font-size:18px;display:flex;align-items:center;gap:8px}.bon>.hd span{font-weight:700;font-variant-numeric:tabular-nums}
.it{border-top:1px solid var(--line)}.it:first-of-type{border-top:0}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px;align-items:center;padding:8px 14px 8px 4px;cursor:pointer}
.row input{width:22px;height:22px;margin:0 auto;accent-color:var(--ok);cursor:pointer}
.it.done .lbl,.it.done .pn{text-decoration:line-through;opacity:.5}
.lbl{font-weight:600}.pn{font-size:13px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.pr s{font-weight:500;color:var(--mute);font-size:14px;margin-right:6px}
.pr .now{color:var(--ok)}
.tag{display:inline-block;background:var(--okbg);color:var(--ok);font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;margin-top:2px}
.det{padding:4px 14px 12px 48px;font-size:14px}
.cmp{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.cmp:first-child{border-top:0}.cmp.best{font-weight:700}
.cmp select{font:13px Figtree,sans-serif;width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;min-height:36px}
.miss{color:var(--warn)}
textarea{width:100%;min-height:260px;font:16px/1.5 Figtree,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
input[type=search]{width:100%;font:16px Figtree,sans-serif;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;font:700 15px Figtree,sans-serif;min-height:44px;padding:0 16px;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns.tight{flex-wrap:nowrap}.btns.tight .btn{flex:1 1 auto;padding:0 10px;justify-content:center;white-space:nowrap}
.pan{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}.pan:empty::before{content:'Nog niets. Wat hier staat, wordt nooit op je lijst gezet.';color:var(--mute);font-size:14px}
.pan button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:999px;padding:6px 10px 6px 12px;font:600 14px Figtree,sans-serif;cursor:pointer}.pan button::after{content:' ×';color:var(--mute)}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-left:auto}.step button{background:var(--card);border:0;width:40px;height:42px;font:700 20px Figtree,sans-serif;color:var(--ink);cursor:pointer}.step b{min-width:22px;text-align:center}
#planBar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:19;max-width:536px;margin:0 auto;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
#planBar[hidden]{display:none}#t-recipes{padding-bottom:72px}#planBar .pt{flex:1;font-weight:700;line-height:1.2}#planBar small{display:block;font-weight:500;opacity:.75}#planBar .btn{background:#fff;color:var(--ink)}#planBar .x{background:none;border:0;color:#fff;opacity:.7;font-size:20px;padding:0 6px;cursor:pointer}
.cath{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);padding:10px 16px 2px}
.fin{width:100%;box-sizing:border-box;font:500 16px Figtree,sans-serif;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:4px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ing{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.ing input{width:20px;height:20px;flex:none}.ing input[type=text]{flex:1;width:auto;height:auto;font:500 15px Figtree,sans-serif;border:0;background:none;color:var(--ink);padding:2px 0}
.ing.pan input[type=text]{color:var(--mute)}
.muted{color:var(--mute);font-size:14px}
.off{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--line)}
.off:first-child{border-top:0}.off .dot{width:10px;height:10px}.off small{display:block;color:var(--mute)}
.off .d{color:var(--ok);font-weight:700;text-align:right;white-space:nowrap;font-size:14px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.facts div{background:var(--field);border-radius:10px;padding:8px}.facts b{display:block;font-size:18px;white-space:nowrap}.facts small{color:var(--mute);font-size:12px}
.rh{cursor:pointer}h3{font-size:16px;margin:12px 0 4px}.steps{margin:0;padding-left:20px}.steps li{margin-bottom:6px}
.empty{text-align:center;padding:28px 10px;color:var(--mute)}
:focus-visible{outline:3px solid var(--aldi);outline-offset:2px}
.status{font-size:14px;color:var(--mute);min-height:20px;margin-top:6px}
</style>
</head>
<body>
<header class="wrap">
  <div class="brand"><img src="icons/logo.svg" alt="" width="44" height="44"><h1>Budget<span>Boodschappen</span></h1></div>
  <div class="stores" id="stores"></div>
</header>
<nav><div class="seg" role="tablist">
  <button role="tab" data-tab="route" aria-selected="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21c-1.7 0-3-1.3-3-3s1.3-3 3-3h12c1.7 0 3-1.3 3-3s-1.3-3-3-3H9"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="2.5"/></svg>Route</button>
  <button role="tab" data-tab="list" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h12M9 12h12M9 18h12"/><path d="M3.5 6l1 1 2-2M3.5 12l1 1 2-2M3.5 18l1 1 2-2"/></svg>Lijst</button>
  <button role="tab" data-tab="recipes" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.3-9.2C1.4 8.4 3.6 5 7 5c2.1 0 3.6 1.2 5 3 1.4-1.8 2.9-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 16.4 12 21 12 21z"/></svg>Recepten</button>
  <button role="tab" data-tab="offers" aria-selected="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9-9-9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Acties</button>
</div></nav>
<main class="wrap">
  <section id="t-route">
    <div class="card" id="sum"></div>
    <div id="bons"></div>
  </section>
  <section id="t-list" hidden>
    <div class="card">
      <h2>Lijst</h2>
      <textarea id="txt" placeholder="500 g kipfilet&#10;1 l halfvolle melk&#10;spaghetti 500 g&#10;2 rode paprika&#10;gele uien"></textarea>
      <div class="btns"><button class="btn" id="save">Opslaan en vergelijken</button><button class="btn sec" id="clear">Lijst leegmaken</button></div>
      <div class="status" id="lstat"></div>
    </div>
    <div class="card"><h2>Altijd in huis</h2>
      <div id="pan" class="pan"></div>
      <div class="btns tight"><input id="panIn" class="fin" placeholder="Bijv. olijfolie, rijst, zout" aria-label="Product dat je altijd in huis hebt" style="margin:0"><button class="btn sec" id="panAdd" style="flex:0 0 auto">Toevoegen</button></div>
    </div>
  </section>
  <section id="t-recipes" hidden>
    <div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">Favorieten</h2><button class="chip" id="pushBtn" aria-pressed="false" hidden>🔔 Meldingen</button></div><div class="status" id="pushSt" style="min-height:0"></div>
      <div class="btns tight"><button class="btn" id="favNew">+ Nieuw</button><label class="btn sec" for="impFile" style="display:inline-flex;align-items:center">📷 Foto</label><button class="btn sec" id="impLinkBtn">🔗 Link</button></div>
      <div id="favForm"></div></div>
    <div id="favs"></div>
    <div id="planBar" hidden></div>
    <div class="card" id="imp" hidden><h2>Recept importeren</h2>
      <div id="impLink" hidden><div class="btns tight" style="margin-top:0"><input id="impUrl" class="fin" type="url" inputmode="url" placeholder="Plak de link van het recept" aria-label="Link van het recept" style="margin:0"><button class="btn" id="impGo" style="flex:0 0 auto">Lees</button></div></div>
      <div class="btns"><select id="impPers" class="btn sec" aria-label="Aantal personen" style="padding:0 12px"><option value="0" selected>Personen: zoals recept</option><option value="1">1 persoon</option><option value="2">2 personen</option><option value="3">3 personen</option><option value="4">4 personen</option><option value="6">6 personen</option></select></div>
      <input type="file" id="impFile" accept="image/*" multiple hidden>
      <div id="impThumbs" class="thumbs"></div><div id="impOut"></div></div>

  </section>
  <section id="t-offers" hidden>
    <div class="card">
      <input type="search" id="q" placeholder="Zoek in aanbiedingen" aria-label="Zoek in aanbiedingen">
      <div class="mode hscroll"><button class="chip" id="otop" aria-pressed="false">🔥 Hoogste korting</button><span id="ofil" style="display:contents"></span></div>
      <div id="offList" style="margin-top:8px"></div>
    </div>
  </section>
</main>
<script src="match.js"></script>
<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>'€'+n.toFixed(2).replace('.',',');
const S={ah:{label:'AH',full:'AH',c:'var(--ah)'},jumbo:{label:'Jumbo',full:'Jumbo',c:'var(--jumbo)'},aldi:{label:'Aldi',full:'Aldi',c:'var(--aldi)'},dirk:{label:'Dirk',full:'Dirk',c:'var(--dirk)'},plus:{label:'Plus',full:'Plus',c:'var(--plus)'},lidl:{label:'Lidl',full:'Lidl',c:'var(--lidl)',noOffers:true}};
const dot=s=>`<span class="dot" style="background:${S[s].c}"></span>`;
const dnl=d=>new Date(d+'T12:00').toLocaleDateString('nl-NL',{day:'numeric',month:'short'});
const today=new Date().toISOString().slice(0,10);
let P=null,O=null,IDX={},state={text:'',done:{},picks:{},stores:['ah','jumbo','aldi'],mode:'split'},open=null,ofil='all',otop=false;
let docRef=null,saving=Promise.resolve();

/* ---------- opslag ---------- */
const LK='boodschappen-v1';
try{Object.assign(state,JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(LK,JSON.stringify(state))}catch(e){}
  if(state.push)pushSyncSoon();
  if(docRef){const body={text:state.text,done:state.done,picks:state.picks,stores:state.stores,mode:state.mode,updated:new Date().toISOString()};
    saving=saving.then(()=>docRef.set(body)).catch(()=>{})}}
const keyOf=l=>Match.norm(l);

/* ---------- berekening ---------- */
function compute(){return computeLines(state.text.split('\n').map(s=>s.trim()).filter(Boolean))}
function computeLines(lines){const res=[];
  for(const line of lines){const it=Match.parseLine(line);if(!it)continue;const k=keyOf(line),per={};
    for(const s of state.stores){if(!IDX[s])continue;
      const cands=Match.candidates(it,IDX[s],6);let pick=cands[0];
      const pk='p:'+it.t.join(' '),want=state.picks[pk]?.[s]||state.picks[k]?.[s];if(want){const f=cands.find(c=>c.p.name===want);if(f)pick=f}
      const o=Match.offerFor(it,O.offers.filter(o=>o.to>=today&&o.from<=addDays(today,6)),s);
      if(!pick&&o&&o.p!=null){const pq=Match.parseQty(o.n);const fake={name:o.n,price:o.p,size:'',qty:pq};pick={p:fake,cost:Match.costOf(it,fake,pq&&pq.d)};cands.unshift(pick)}
      if(!pick){per[s]=null;continue}
      const cost=pick.cost||Match.costOf(it,pick.p,pick.p.qty&&pick.p.qty.d);
      let total=cost.total,deal=null;
      if(o){let op=cost.packs;const oq=Match.parseQty(o.n);if(it.req&&oq&&oq.d===it.req.d&&oq.q>0)op=Math.max(1,Math.ceil(it.req.q/oq.q-1e-9));
        if(o.p!=null&&o.p*op<total){deal=o;total=o.p*op;cost.packs=op}else if(o.pct&&!want){deal=o;total=total*(1-o.pct)}}
      const regular=deal&&deal.was&&deal.p!=null?deal.was*cost.packs:cost.total;
      per[s]={pick,cands,total,regular,packs:cost.packs,deal,sub:!!pick.sub}}
    res.push({line,k,it,per})}
  return res}
function addDays(d,n){const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}

/* ---------- afdelingen ---------- */
const CATS=[
 ['Groente & fruit',/(appel|peer|peren|banaan|banan|sinaas|mandarijn|clementine|citroen|limoen|druif|druiven|bessen|aardbei|framboz|mango|ananas|kiwi|meloen|avocado|tomaat|tomaten|komkommer|paprika|\bui\b|uien|sjalot|knoflook|prei|wortel|peen|broccoli|bloemkool|spruit|kool|spinazie|\bsla\b|ijsberg|rucola|andijvie|witlof|courgette|aubergine|champignon|paddenstoel|oesterzwam|taug|bosui|lente-?ui|gember|aardappel|krieltjes|pompoen|biet|radijs|selderij|venkel|asperge|sperzie|boontjes|peterselie|koriander|basilicum|bieslook|munt|dadel|vijg|pruim|fruit|groente|salade|edamame|peultjes)/],
 ['Brood & ontbijt',/(brood|bolletjes|broodjes|wrap|tortilla|pita|croissant|beschuit|crackers|knäck|havermout|muesli|granola|cornflakes|pindakaas|jam|hagelslag|honing|ontbijt)/],
 ['Vlees, vis & vega',/(kip|gehakt|rund|varken|biefstuk|\bspek|ham\b|worst|shoarma|schnitzel|hamburger|burger|bacon|lams|tonijn|zalm|kabeljauw|pangasius|garnal|\bvis\b|vissticks|mossel|tofu|tempeh|vega|filet|steak|lapjes|drumstick)/],
 ['Zuivel, kaas & eieren',/(melk|yoghurt|kwark|skyr|\bvla|kaas|boter|room|crème|creme|eieren|\bei\b|mozzarella|feta|parmez|halloumi|cottage|ricotta|mascarpone)/],
 ['Pasta, rijst & wereld',/(pasta|spaghetti|penne|macaroni|fusilli|tagliatelle|lasagne|noedel|\bmie\b|rijst|couscous|bulgur|quinoa|gnocchi|kokosmelk|curry|sojasaus|ketjap|wok|taco|nasi|bami|sambal|sriracha)/],

const catOf=r=>{const t=(r.line+' '+(r.per&&Object.values(r.per).find(Boolean)?.pick?.p?.name||'')).toLowerCase();for(let i=0;i<CATS.length;i++)if(CATS[i][1].test(t))return i;return CATS.length};

  for(const s of order){lines.push('',`${S[s].full}`);const g=[...groups[s]].sort((a,b)=>catOf(a)-catOf(b));for(const r of g)lines.push(`• ${r.line}`)}

  const one={};for(const s of sel){one[s]={sum:0,miss:0,sub:0};for(const r of R){if(r.per[s]){one[s].sum+=r.per[s].total;if(r.per[s].sub)one[s].sub++}else one[s].miss++}}
  const assign=r=>{if(state.mode!=='split'){return r.per[state.mode]?state.mode:null}
    let b=null;const ex=sel.some(s=>r.per[s]&&!r.per[s].sub),ms=Math.min(...sel.map(s=>r.per[s]&&r.per[s].sub?r.per[s].pick.score:99));for(const s of sel){const y=r.per[s];if(y&&(ex?!y.sub:y.pick.score<=ms+0.1)&&(!b||y.total<r.per[b].total-1e-9))b=s}return b};
  const groups={},miss=[];let split=0;
  for(const r of R){const s=assign(r);if(!s){miss.push(r);continue}(groups[s]=groups[s]||[]).push(r);split+=r.per[s].total}

    <div class="mode"><button class="chip" id="shareBtn">↗ Delen</button><button class="chip${state.mode==='split'?' on':''}" data-mode="split">Goedkoopst verdeeld</button>${sel.map(s=>`<button class="chip${state.mode===s?' on':''}" data-mode="${s}">Alles bij ${S[s].label}</button>`).join('')}</div>`;
  const order=['aldi','lidl','dirk','plus','jumbo','ah'].filter(s=>groups[s]);lastShare=()=>shareList(groups,order,miss,split);

   +(miss.length?`<div class="bon"><div class="hd"><b class="miss">Niet gevonden</b><span></span></div>${miss.map(r=>`<div class="it"><div class="row" style="cursor:default"><span></span><div><div class="lbl">${esc(r.line)}</div><div class="pn">Probeer een andere omschrijving in je lijst.</div></div><span></span></div></div>`).join('')}</div>`:'');

function bestOf(r){let b=null;const ex=state.stores.some(s=>r.per[s]&&!r.per[s].sub);for(const s of state.stores){const y=r.per[s];if(y&&(!ex||!y.sub)&&(!b||y.total<r.per[b].total))b=s}return b}
if(!Array.isArray(state.favs))state.favs=[];

const fmtQ=(q,d)=>d==='kg'?(q<1?Math.round(q*1000)+' g':String(+q.toFixed(2)).replace('.',',')+' kg'):d==='l'?(q<1?Math.round(q*1000)+' ml':String(+q.toFixed(2)).replace('.',',')+' l'):String(q);
// zelfde product twee keer? Dan optellen: 300 g + 500 g kipfilet = 800 g kipfilet
function mergeLines(base,add){const out=[...base];
  for(const l of add){const it=Match.parseLine(l);if(!it){if(!out.some(x=>Match.norm(x)===Match.norm(l)))out.push(l);continue}
    const k=it.t.join(' '),i=out.findIndex(x=>{const e=Match.parseLine(x);return e&&e.t.join(' ')===k});
    if(i<0){out.push(l);continue}
    const e=Match.parseLine(out[i]);
    if(it.req&&e.req&&it.req.d===e.req.d)out[i]=fmtQ(it.req.q+e.req.q,it.req.d)+' '+e.label;
    else if(!it.req&&!e.req)out[i]=(e.n+it.n)+' '+e.label;
    else out.push(l)}
  return out}

function costOfLines(lines){let sum=0,miss=0;if(!P)return{sum,miss};for(const r of computeLines(lines)){const b=bestOf(r);if(b)sum+=r.per[b].total;else miss++}return{sum,miss}}

const devId=(()=>{try{let d=localStorage.getItem('bb-device');if(!d){d=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem('bb-device',d)}return d}catch(e){return 'x'}})();
const UNIT=/^(\d+[,.]?\d*|½|¼|¾|\d+\/\d+)\s*(g|gr|gram|kg|kilo|ml|dl|cl|l|liter|el|tl|stuks?|st|teen|tenen|blik|blikjes?|pak|pakjes?|bos|bosjes?|zakje|zakjes?|bol|bollen|potje|potjes|krop|kroppen)?\b/i;
function fracNum(t){if(t==='½')return .5;if(t==='¼')return .25;if(t==='¾')return .75;if(/\//.test(t)){const[a,b]=t.split('/');return +a/+b}return parseFloat(t.replace(',','.'))}
function scaleLine(l,k){if(k===1)return l;const um=l.match(UNIT),count=!(um&&um[2]&&/^(g|gr|gram|kg|kilo|ml|dl|cl|l|liter)$/i.test(um[2]));return l.replace(/^(\d+[,.]?\d*|½|¼|¾|\d+\/\d+)/,t=>{let v=fracNum(t)*k;v=count?Math.max(1,Math.ceil(v-0.01)):v>=10?Math.round(v/5)*5||Math.round(v):Math.round(v*4)/4;return String(v).replace('.',',')}).replace(/^(\d{4,})\s*(g|ml)\b/,(m,v,u)=>String(+v/1000).replace('.',',')+(u==='g'?' kg':' l'))}
function shrink(file){return new Promise((ok,no)=>{const im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{const m=1568,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.82).split(',')[1])};im.onerror=()=>no(new Error('foto'));im.src=u})}
$('impFile').addEventListener('change',async e=>{const fs=[...e.target.files].slice(0,4);e.target.value='';if(!fs.length)return;const out=$('impOut');
  $('imp').hidden=false;$('imp').scrollIntoView({behavior:'smooth',block:'start'});
  $('impThumbs').innerHTML='';for(const f of fs){const i=document.createElement('img');i.alt='';i.src=URL.createObjectURL(f);$('impThumbs').appendChild(i)}
  $('impLink').hidden=true;
  try{const images=[];for(const f of fs)images.push(await shrink(f));await runScan({images})}
  catch(err){out.innerHTML='<p class="muted">Lezen is niet gelukt. Controleer je internet en probeer het opnieuw.</p>'}});
async function runScan(payload){const out=$('impOut'),persons=+$('impPers').value;out.innerHTML='<p class="muted">Claude leest je recept…</p>';
  try{const r=await fetch('/api/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...payload,persons,device:devId})});
    const d=await r.json().catch(()=>({error:'Lezen is niet gelukt.'}));
    if(!r.ok||d.error){out.innerHTML=`<p class="muted">${esc(d.error||'Lezen is niet gelukt.')}</p>`;return}
    scan=d;scanBase=persons||d.servings||0;showScan()}
  catch(err){out.innerHTML='<p class="muted">Lezen is niet gelukt. Controleer je internet en probeer het opnieuw.</p>'}}
$('impLinkBtn').addEventListener('click',()=>{$('imp').hidden=false;$('impLink').hidden=false;$('impThumbs').innerHTML='';$('impOut').innerHTML='';$('imp').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('impUrl').focus(),300)});
$('impGo').addEventListener('click',()=>{const u=$('impUrl').value.trim();if(!/^https?:\/\/\S+\.\S+/.test(u)){$('impOut').innerHTML='<p class="muted">Plak een volledige link, beginnend met https://</p>';return}runScan({url:u})});
$('impUrl').addEventListener('keydown',e=>{if(e.key==='Enter')$('impGo').click()});
$('impPers').addEventListener('change',()=>{if(scan)showScan()});
function showScan(){const out=$('impOut'),want=+$('impPers').value,k=want&&scanBase?want/scanBase:1;
  const buy=scan.items.filter(l=>!inPantry(l)),pan=[...scan.pantry,...scan.items.filter(inPantry)];
  const row=(l,on,pan)=>`<label class="ing${pan?' pan':''}"><input type="checkbox" ${on?'checked':''}><input type="text" value="${esc(pan?l:scaleLine(l,k))}" aria-label="Ingrediënt"></label>`;
  out.innerHTML=`<input id="impTitle" class="fin" value="${esc(scan.title)}" aria-label="Naam van het recept" style="margin-top:12px;font-weight:700">
    <p class="muted" style="margin:8px 0 4px">${scan.guess?'Herkend van een foto van het gerecht, controleer de ingrediënten. ':''}${scanBase?`Voor ${want||scanBase} ${(want||scanBase)===1?'persoon':'personen'}.`:''}</p>
    ${(scan.kcal||scan.protein)?`<p class="muted" style="margin:0 0 4px">± ${[scan.kcal?scan.kcal+' kcal':'',scan.protein?scan.protein+' g eiwit':''].filter(Boolean).join(' · ')} per persoon</p>`:''}
    ${buy.map(l=>row(l,true,false)).join('')}${pan.length?`<p class="muted" style="margin:10px 0 0">Voorraadkast <button class="chip" id="impPan" style="min-height:30px;margin-left:6px">Altijd in huis</button></p>${pan.map(l=>row(l,false,true)).join('')}`:''}
    <div class="btns"><button class="btn" id="impAdd">Op lijst</button><button class="btn sec" id="impFav">Bewaar</button><button class="btn sec" id="impClear">Wissen</button></div>`}
const impLines=()=>[...$('impOut').querySelectorAll('.ing')].filter(l=>l.querySelector('input[type=checkbox]').checked).map(l=>l.querySelector('input[type=text]').value.trim()).filter(Boolean);
$('impOut').addEventListener('click',e=>{const t=e.target;
  if(t.id==='impClear'){scan=null;$('imp').hidden=true;$('impUrl').value='';$('impThumbs').innerHTML='';$('impOut').innerHTML='';return}
  if(t.id==='impPan'){addPantry([...$('impOut').querySelectorAll('.ing.pan input[type=text]')].map(x=>x.value));t.textContent='Onthouden ✓';return}
  if(t.id==='impFav'){const items=impLines();if(!items.length)return;state.favs.unshift({id:'f'+Date.now().toString(36),title:($('impTitle').value.trim()||'Recept'),items,kcal:scan&&scan.kcal||null,protein:scan&&scan.protein||null});persist();renderRecipes();t.textContent='Bewaard ✓';return}
  if(t.id==='impAdd'){t.textContent=addMsg(addLines(impLines()))}});

/* ---------- pushmeldingen ---------- */
const canPush='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
function pushUI(){const b=$('pushBtn');b.hidden=false;b.classList.toggle('on',!!state.push);b.setAttribute('aria-pressed',!!state.push);b.textContent=state.push?'🔔 Meldingen aan':'🔕 Meldingen'}
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from(r,c=>c.charCodeAt(0))};
async function pushSub(){const reg=await navigator.serviceWorker.ready;return reg.pushManager.getSubscription()}
async function pushSync(){const sub=await pushSub();if(!sub)return;
  await fetch('/api/push',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON(),favs:state.favs,stores:state.stores})})}
var pushT=null;function pushSyncSoon(){clearTimeout(pushT);pushT=setTimeout(()=>pushSync().catch(()=>{}),1500)}
$('pushBtn').addEventListener('click',async()=>{const st=$('pushSt');st.textContent='';
  if(state.push){try{const sub=await pushSub();if(sub){await fetch('/api/push',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({subscription:sub.toJSON()})});await sub.unsubscribe()}}catch(e){}
    state.push=false;persist();pushUI();st.textContent='Meldingen uit.';return}
  if(isIOS&&!standalone){st.textContent='Zet de app eerst op je beginscherm (Deel → Zet op beginscherm) en open hem daar.';return}
  if(!canPush){st.textContent='Je browser ondersteunt geen meldingen.';return}
  try{const perm=await Notification.requestPermission();if(perm!=='granted'){st.textContent='Meldingen zijn niet toegestaan. Zet ze aan in Instellingen → Meldingen.';return}
    const {key}=await fetch('/api/push').then(r=>r.json());const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(key)});
    state.push=true;persist();await pushSync();pushUI();st.textContent='Aan: je krijgt een melding als een favoriet recept minstens 20% goedkoper is.'}
  catch(e){st.textContent='Aanzetten is niet gelukt. Probeer het opnieuw.'}});
pushUI();
{const t=new URLSearchParams(location.search).get('tab');if(t&&['route','list','recipes','offers'].includes(t))tab(t)}
}
</script>
